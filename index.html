<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive 3D spaces in your browser — single objects and whole worlds."
    />
    <title>3D World</title>
  </head>
  <body>
    <div id="app" aria-label="3D viewport">
      <!-- Spec 005, AC-5: without JavaScript nothing else ever renders here. -->
      <noscript>
        <div class="fallback" role="alert">
          <h1>JavaScript is turned off</h1>
          <p>
            3D World needs JavaScript and WebGL2 to show its 3D spaces. Turn JavaScript on and reload the
            page.
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
